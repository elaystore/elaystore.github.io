<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ürün Detayı | Elay Store</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f5f3f1;color:#222}
    header{background:#9a663f;padding:18px 6%} header a{color:#fff;text-decoration:none;font-weight:700}
    .detay{max-width:1050px;margin:35px auto;background:#fff;border-radius:18px;padding:34px;display:grid;grid-template-columns:1fr 1fr;gap:42px;box-shadow:0 6px 24px #00000012}
    .resim img{width:100%;height:500px;object-fit:contain;background:#faf8f5;border-radius:14px}
    h1{font-size:34px;margin-top:8px}.puan{color:#e7a900;font-size:19px}.eski{text-decoration:line-through;color:#999;margin-top:14px}.fiyat{font-size:34px;font-weight:700;margin:5px 0}.stok{color:#159447;font-size:18px;margin:14px 0}
    .ozellikler{border-top:1px solid #ddd;margin-top:24px;padding-top:12px}.ozellikler li{margin:12px 0}
    button{width:100%;padding:15px;border:0;border-radius:10px;background:#9a663f;color:#fff;font-size:18px;font-weight:700;cursor:pointer;margin-top:18px}
    @media(max-width:700px){.detay{grid-template-columns:1fr;margin:16px;padding:20px}.resim img{height:340px}h1{font-size:28px}}
  </style>
  <link rel="stylesheet" href="tema.css?v=12">
  <script src="analitik.js?v=1" defer></script>
</head>
<body>
  <header>
    <a class="marka" href="index.html" aria-label="Elay Filografi ana sayfa"><img class="site-logo" src="elay-logo.jpeg?v=3" alt="Elay Filografi logosu"></a>
    <nav>
      <a href="index.html">← Ürünlere Dön</a>
      <a href="kisiye-ozel.html">Kişiye Özel Sipariş</a>
    </nav>
  </header>
  <main class="detay">
    <div class="resim"><img id="resim" alt="Ürün fotoğrafı"></div>
    <section>
      <h1 id="ad"></h1><div class="puan" id="puan"></div><div class="eski" id="eski"></div>
      <div class="fiyat" id="fiyat"></div><div class="stok" id="stok"></div>
      <div class="ozellikler"><h2>Ürün Özellikleri</h2><ul id="ozellik"></ul></div>
      <button type="button" onclick="sepeteEkle()">🛒 Sepete Ekle</button>
    </section>
  </main>
  <section class="yorumlar" aria-labelledby="yorumBaslik">
    <div class="yorumlar-ust">
      <div>
        <h2 id="yorumBaslik">Müşteri Yorumları</h2>
        <p id="yorumOzet" class="yorum-ozet">Henüz yorum yapılmamış.</p>
      </div>
      <div id="yorumOrtalama" class="yorum-ortalama" aria-label="Ortalama puan">—</div>
    </div>

    <div id="yorumGirisUyari" class="yorum-giris-uyari">
      Yorum yazmak için <a id="yorumGirisLinki" href="uye.html">üye girişi yapın</a>.
    </div>

    <form id="yorumFormu" class="yorum-formu" hidden>
      <fieldset>
        <legend>Puanınız</legend>
        <div class="yildiz-secimi" aria-label="Ürüne yıldız verin">
          <input type="radio" name="puan" id="puan5" value="5" required><label for="puan5" title="5 yıldız">★</label>
          <input type="radio" name="puan" id="puan4" value="4"><label for="puan4" title="4 yıldız">★</label>
          <input type="radio" name="puan" id="puan3" value="3"><label for="puan3" title="3 yıldız">★</label>
          <input type="radio" name="puan" id="puan2" value="2"><label for="puan2" title="2 yıldız">★</label>
          <input type="radio" name="puan" id="puan1" value="1"><label for="puan1" title="1 yıldız">★</label>
        </div>
      </fieldset>
      <label for="yorumMetni">Yorumunuz</label>
      <textarea id="yorumMetni" maxlength="500" rows="4" placeholder="Ürün hakkındaki düşüncenizi yazın." required></textarea>
      <div class="yorum-form-alt">
        <small>En fazla 500 karakter</small>
        <button type="submit" id="yorumGonder">Yorumu Gönder</button>
      </div>
      <p id="yorumMesaj" class="yorum-mesaj" role="status" aria-live="polite"></p>
    </form>

    <div id="yorumListesi" class="yorum-listesi" aria-live="polite">
      <p class="yorum-yukleniyor">Yorumlar yükleniyor…</p>
    </div>
  </section>
  <script>
    const ortakOzellikler=['El işçiliğiyle hazırlanmıştır','Filografi çivi ve tel tekniği kullanılmıştır','Sipariş ve ölçü bilgisi için iletişime geçebilirsiniz'];
    const tabloHazirlanma='Hazırlanma süresi; seçilen tablo modeli, ölçü, renk ve işçilik yoğunluğuna göre değişmektedir. Tahmini teslim süresi sipariş öncesinde WhatsApp üzerinden bildirilir.';
    const urunler={
      mouse:{ad:'El İşi Bileklik',fiyat:350,resim:'resim.jpg',puan:'⭐⭐⭐⭐⭐ 4.8 / 5',stok:'🟢 Stokta Var',oz:['Bileğe göre hazırlanabilir','Farklı renk seçenekleri vardır']},
      tablo01:{ad:'Zarif Hat Filografi Tablosu',fiyat:2500,resim:'tablo-01.png'},
      tablo02:{ad:'Turkuaz Hat Filografi Tablosu',fiyat:8500,eski:'10.000 TL',resim:'tablo-02.png'},
      tablo03:{ad:'Lale Motifli Filografi Tablosu',fiyat:2200,resim:'tablo-03.png'},
      tablo04:{ad:'Siyah Zemin Hat Filografi Tablosu',fiyat:16500,resim:'tablo-04.png'},
      tablo05:{ad:'Geometrik Altın Filografi Tablosu',fiyat:12500,resim:'tablo-05.png'},
      tablo06:{ad:'Allah Lafzı Filografi Tablosu',fiyat:4500,resim:'tablo-06.png'},
      tablo07:{ad:'Bereket Duası Filografi Tablosu',fiyat:9500,resim:'tablo-07.png'},
      tablo08:{ad:'Yuvarlak Ahşap Filografi Tablosu',fiyat:11500,resim:'tablo-08.png'},
      tablo09:{ad:'Vav Filografi Tablosu',fiyat:3500,resim:'tablo-09.png'},
      tablo10:{ad:'Gümüş Zemin Hat Filografi Tablosu',fiyat:8500,resim:'tablo-10.png'}
    };
    const id=new URLSearchParams(location.search).get('urun')||'mouse';
    const p=urunler[id]||urunler.mouse;
    if(!p.puan)p.puan='⭐⭐⭐⭐⭐ 5.0 / 5'; if(!p.stok)p.stok='🟢 Stokta Var'; if(!p.oz)p.oz=[...ortakOzellikler];
    if(id.startsWith('tablo'))p.oz.push(tabloHazirlanma);
    document.getElementById('ad').textContent=p.ad; document.getElementById('fiyat').textContent=p.fiyat.toLocaleString('tr-TR')+' TL';
    document.getElementById('eski').textContent=p.eski||''; document.getElementById('puan').textContent=p.puan; document.getElementById('stok').textContent=p.stok;
    document.getElementById('resim').src=p.resim; document.getElementById('resim').alt=p.ad; if(id==='tablo03')document.getElementById('resim').classList.add('ters-resim');
    p.oz.forEach(x=>{const li=document.createElement('li');li.textContent=x;document.getElementById('ozellik').appendChild(li)});
    function sepeteEkle(){let s=[];try{s=JSON.parse(localStorage.getItem('sepet')||'[]');if(!Array.isArray(s))s=[]}catch(e){s=[]}s.push({ad:p.ad,fiyat:p.fiyat,resim:p.resim});localStorage.setItem('sepet',JSON.stringify(s));alert(p.ad+' sepete eklendi! 🛒')}
  </script>
  <script type="module" src="yorumlar.js?v=2"></script>
</body>
</html>
